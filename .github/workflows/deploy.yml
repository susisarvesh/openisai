name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy API
        working-directory: api
        env:
          VERCEL_ORG_ID: team_pmHFI7vG7bjlBGJKQFAJS7oc
          VERCEL_PROJECT_ID: prj_QiFvPurTDzpenXVsNq8ftqg7ePLI
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --scope sarveshs-projects-1da554e1

  web:
    name: Site
    needs: api
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Deploy site
        working-directory: web
        env:
          VERCEL_ORG_ID: team_pmHFI7vG7bjlBGJKQFAJS7oc
          VERCEL_PROJECT_ID: prj_xLT724dHe5YJHIqAQaOqRS3qEJmk
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VITE_API_URL: https://openisai-api.vercel.app
          VITE_CLERK_PUBLISHABLE_KEY: ""
        run: npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" --scope sarveshs-projects-1da554e1
