<!doctype html>
<html lang="en" class="dark">
	<head>
		<meta charset="UTF-8" />

		<!-- Favicon — real asset -->
		<link rel="icon" type="image/png" href="/assets/openisai-logo.png" />
		<link rel="apple-touch-icon" href="/assets/openisai-logo.png" />

		<meta
			name="viewport"
			content="width=device-width, initial-scale=1.0, viewport-fit=cover"
		/>
		<meta name="theme-color" content="#000000" />
		<meta name="mobile-web-app-capable" content="yes" />
		<meta name="apple-mobile-web-app-capable" content="yes" />
		<meta
			name="apple-mobile-web-app-status-bar-style"
			content="black-translucent"
		/>
		<meta name="apple-mobile-web-app-title" content="Save Songs" />
		<meta name="application-name" content="Save Songs" />

		<!-- ── SEO ────────────────────────────────────────────────
		     Static defaults for the app shell. Per-route values are set at
		     runtime by lib/seo.ts (document.title + meta[cannonical] swaps).
		     Google renders JS, but the static defaults are what every
		     non-JS consumer (IM scrapers, some engines) will ever see. -->
		<title>Save Songs</title>
		<meta
			name="description"
			content="Save Songs lets you paste a Spotify playlist or album, save the songs to your Google Drive, and play them."
		/>
		<link rel="canonical" href="https://save-songs.vercel.app/" />
		<meta name="robots" content="index, follow" />

		<!-- Open Graph -->
		<meta property="og:title" content="Save Songs" />
		<meta
			property="og:description"
			content="Paste a Spotify playlist or album, save the songs to your Google Drive, and play them."
		/>
		<meta
			property="og:image"
			content="https://save-songs.vercel.app/assets/openisai-logo.png"
		/>
		<meta property="og:image:alt" content="Save Songs logo" />
		<meta property="og:type" content="website" />
		<meta property="og:site_name" content="Save Songs" />
		<meta property="og:url" content="https://save-songs.vercel.app/" />
		<meta property="og:locale" content="en_US" />

		<!-- Twitter/X -->
		<meta name="twitter:card" content="summary" />
		<meta name="twitter:title" content="Save Songs" />
		<meta
			name="twitter:description"
			content="Paste a Spotify playlist or album, save the songs to your Google Drive, and play them."
		/>
		<meta
			name="twitter:image"
			content="https://save-songs.vercel.app/assets/openisai-logo.png"
		/>

		<!-- Structured data — what the results page can render about us -->
		<script type="application/ld+json">
			{
				"@context": "https://schema.org",
				"@type": "WebApplication",
				"name": "Save Songs",
				"url": "https://save-songs.vercel.app/",
				"applicationCategory": "MultimediaApplication",
				"operatingSystem": "Web",
				"description": "Paste a Spotify playlist or album, save the songs to your Google Drive, and play them.",
				"offers": {
					"@type": "Offer",
					"price": "0",
					"priceCurrency": "USD"
				}
			}
		</script>

		<!-- Fonts -->
		<link rel="preconnect" href="https://fonts.googleapis.com" />
		<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
		<link
			href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap"
			rel="stylesheet"
		/>
	</head>
	<body class="bg-base text-primary antialiased overflow-hidden">
		<div id="root"></div>
		<script>
			if (import.meta.env.development) {
			    const script = document.createElement("script");
			    script.src = "https://cdn.jsdelivr.net/npm/eruda";
			    script.onload = () => eruda.init();
			    document.head.appendChild(script);
			}
		</script>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
